{% extends "base.html" %}
{% set active_tab = 'more' %}
{% block title %}その他 | ふたり暮らし{% endblock %}
{% block content %}
<header class="page-head"><div><h1>その他</h1></div></header>
<nav class="list menu" aria-label="その他の機能">
  <a href="{{ url_for('main.calendar') }}"><span class="glyph"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></span>
    <span>予定<small>二人の予定・それぞれの予定・ゴミの日</small></span></a>
  <a href="{{ url_for('main.tasks') }}"><span class="glyph"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1.2 1.2L6.8 5M3.5 12l1.2 1.2 2.1-2.2M3.5 18l1.2 1.2 2.1-2.2"/></svg></span>
    <span>タスク<small>手続きや予約など、一度きりのやること</small></span></a>
  <a href="{{ url_for('main.pantry') }}"><span class="glyph"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="3" width="12" height="18" rx="2.5"/><path d="M6 10h12M9.5 6v1.5M9.5 13v2.5"/></svg></span>

  <a href="{{ url_for('main.recipes') }}"><span class="glyph"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h11a3 3 0 0 1 3 3V20H8a3 3 0 0 1-3-3z"/><path d="M9 9h6M9 13h4"/></svg></span>

  <a href="{{ url_for('main.notes') }}"><span class="glyph"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h9l4 4V19a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 19V5a1.5 1.5 0 0 1 1-1.5z"/><path d="M14.5 3.5V8H19M8.5 12.5h7M8.5 16h5"/></svg></span>

  <a href="{{ url_for('main.settings') }}"><span class="glyph"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg></span>
